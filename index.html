var RECIPES = SEED;

function setLang(k){
  LANG=k;
  localStorage.setItem('recipe_lang',k);
  init();
}
function setCat(k){
  CAT=k;
  initTabs();
  render();
}
function init(){
  var langHtml='';
  var langs=['zh','en','id'];
  for(var i=0;i<langs.length;i++){
    var x=langs[i];
    var cls = (LANG==x)?'active':'';
    langHtml += '<button class="'+cls+'" onclick="setLang(\''+x+'\')">'+x.toUpperCase()+'</button>';
  }
  document.getElementById('lang').innerHTML=langHtml;
  initTabs();
  render();
  if(initialRecipe){
    setTimeout(function(){
      for(var i=0;i<RECIPES.length;i++){
        if(RECIPES[i].rid==initialRecipe){
          openDetail(initialRecipe);
          break;
        }
      }
    },500);
  }
}
function initTabs(){
  var h='';
  for(var i=0;i<CATS.length;i++){
    var c=CATS[i];
    var label=c[LANG]||c.zh;
    var cls=(CAT==c.k)?'active':'';
    h+='<button class="'+cls+'" onclick="setCat(\''+c.k+'\')">'+label+'</button>';
  }
  document.getElementById('tabs').innerHTML=h;
}
function getTr(r){ return r[LANG]||r.zh; }
function render(){
  var qEl=document.getElementById('q');
  var q=(qEl.value||'').toLowerCase();
  var list=[];
  for(var i=0;i<RECIPES.length;i++){
    var r=RECIPES[i];
    if(CAT!='all' && r.cat!=CAT) continue;
    var tr=getTr(r);
    if(q && tr.t.toLowerCase().indexOf(q)==-1) continue;
    list.push(r);
  }
  var grid=document.getElementById('grid');
  if(list.length==0){
    grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px">暫無菜譜</div>';
    return;
  }
  var out='';
  for(var i=0;i<list.length;i++){
    var r=list[i];
    var tr=getTr(r);
    out+='<div class="card" onclick="openDetail(\''+r.rid+'\')">';
    out+='<img src="'+r.img+'">';
    out+='<div class="p"><div style="font-weight:800">'+tr.t+'</div>';
    out+='<div style="font-size:12px;color:#777;margin-top:4px">⏱️ '+(tr.cookTime||'')+' | 總 '+(tr.totalTime||'')+' | '+tr.serv+'</div></div></div>';
  }
  grid.innerHTML=out;
}
function openDetail(rid){
  var r=null;
  for(var i=0;i<RECIPES.length;i++){ if(RECIPES[i].rid==rid){ r=RECIPES[i]; break; } }
  if(!r) return;
  currentRid=rid;
  var tr=getTr(r);
  var html='<img src="'+r.img+'"><div style="padding:16px"><h2 style="margin:0">'+tr.t+'</h2>';
  html+='<div style="font-size:12px;color:#777;margin:6px 0">總 '+(tr.totalTime||'')+' | 煮 '+(tr.cookTime||'')+' | 備 '+(tr.prepTime||'')+' | '+tr.serv+'</div>';
  html+='<h4>材料</h4><div>'+tr.ing.join('<br>')+'</div><h4>步驟</h4><div>';
  for(var i=0;i<tr.step.length;i++){ html+=(i+1)+'. '+tr.step[i]+'<br>'; }
  html+='</div><div style="margin-top:14px"><button class="btn black" onclick="openShare(\''+rid+'\')">🔗 分享此語言</button> <button class="btn" onclick="closeDetail()">關閉</button></div></div>';
  document.getElementById('detailBox').innerHTML=html;
  document.getElementById('detail').classList.add('open');
}
function closeDetail(){ document.getElementById('detail').classList.remove('open'); }
function openShare(rid){
  var r=null;
  for(var i=0;i<RECIPES.length;i++){ if(RECIPES[i].rid==rid){ r=RECIPES[i]; break; } }
  if(!r) return;
  var tr=getTr(r);
  var map={zh:'中文', en:'English', id:'Indonesia'};
  var label=map[LANG]||LANG;
  var url=location.origin+location.pathname+'?recipe='+r.rid+'&lang='+LANG;
  var html='<h3>🔗 分享 Share</h3>';
  html+='<div style="font-size:13px;margin:8px 0">正在分享：<b>'+tr.t+'</b> 的 <b>'+label+' ('+LANG+')</b> 版本</div>';
  html+='<div style="background:#FFFDF0;border:1px solid #EDE6D6;padding:10px;font-size:13px;white-space:pre-wrap;max-height:240px;overflow:auto">'+tr.t+' - '+(tr.totalTime||'')+'\n材料:\n'+tr.ing.join('\n')+'\n\n步驟:\n';
  for(var i=0;i<tr.step.length;i++){ html+=(i+1)+'. '+tr.step[i]+'\n'; }
  html+='\n'+url+'</div>';
  html+='<div style="margin-top:12px"><button class="btn black" onclick="copyLink(\''+r.rid+'\')">🔗 Copy 連結</button> <button class="btn" onclick="closeShare()">關閉</button></div>';
  html+='<div style="margin-top:8px;font-size:11px;color:#999">?recipe='+r.rid+'&lang='+LANG+'</div>';
  document.getElementById('shareBox').innerHTML=html;
  document.getElementById('share').classList.add('open');
}
function closeShare(){ document.getElementById('share').classList.remove('open'); }
function copyLink(rid){
  var url=location.origin+location.pathname+'?recipe='+rid+'&lang='+LANG;
  navigator.clipboard.writeText(url).then(function(){ alert('連結已複製: '+url); });
}
if(urlParams.get('reset')=='1'){
  localStorage.removeItem('recipe_lang');
  location.href=location.pathname;
}
init();
</script>
</body>
</html>
