<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joe's Recipe Lab - 精美菜譜 Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFCF5;--paper:#FFFDF0;--ink:#1a1a1a;--muted:#8a7a65;--line:#EDE6D6;--accent:#FFC107;--accent2:#FF6B35;--green:#2E7D32}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:'Noto Sans TC',-apple-system,sans-serif;color:var(--ink);background-image:radial-gradient(#EDE6D6 1px, transparent 1px);background-size:24px 24px}
header{position:sticky;top:0;background:rgba(255,252,245,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;z-index:10}
.logo{font-family:'Noto Serif TC',serif;font-weight:800;font-size:20px;letter-spacing:0.5px} .logo span{color:var(--accent2)}
.lang button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;margin-left:6px;cursor:pointer;font-weight:700} .lang button.active{background:#111;color:#fff}
.hero{max-width:1000px;margin:0 auto;padding:32px 16px 12px;text-align:center}
.hero h1{font-family:'Noto Serif TC',serif;font-size:36px;margin:0;letter-spacing:1px}
.hero p{color:var(--muted);margin:8px 0 0;font-size:14px}
.main{max-width:1000px;margin:auto;padding:0 16px 40px}
.search{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,0.03)}
.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0;padding-bottom:6px} .tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer;transition:all 0.2s} .tabs button.active{background:var(--accent);border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 12px rgba(255,193,7,0.3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;cursor:pointer;transition:all 0.3s;box-shadow:0 4px 16px rgba(0,0,0,0.04)} .card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,0.08)}
.card img{width:100%;height:200px;object-fit:cover;display:block} .card .p{padding:14px 16px}
.card .title{font-family:'Noto Serif TC',serif;font-weight:800;font-size:18px;margin:0 0 6px}
.card .meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.badge{background:var(--paper);border:1px solid #F5E9C6;border-radius:999px;padding:2px 8px;font-size:11px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);z-index:30;padding:16px;place-items:center} .modal.open{display:grid}
.box{background:#fff;border-radius:24px;max-width:760px;width:100%;max-height:94vh;overflow:auto;box-shadow:0 24px 64px rgba(0,0,0,0.2)} .box img{width:100%;height:320px;object-fit:cover;display:block}
.content{padding:20px 24px} .content h2{font-family:'Noto Serif TC',serif;font-size:26px;margin:0} .content h4{font-family:'Noto Serif TC',serif;margin:18px 0 8px;font-size:16px;border-left:4px solid var(--accent);padding-left:10px}
.ing{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0} .ing div{background:var(--paper);border:1px solid #F5E9C6;border-radius:12px;padding:9px 11px;font-size:13px}
.step{display:flex;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:#fff} .num{width:34px;height:34px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-weight:800;flex-shrink:0;font-size:14px}
.tip{background:#FFF8CC;border:1px solid var(--accent);border-radius:14px;padding:12px;margin:12px 0;font-size:13px} .secret{background:#E8F5E9;border:1px solid #A5D6A7;border-radius:14px;padding:12px;margin:12px 0;font-size:13px}
.serve-box{background:#F8F6F0;border-radius:14px;padding:12px;margin-top:14px;font-size:13px;border:1px dashed var(--line)}
.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer;margin-right:6px;transition:all 0.2s} .btn:hover{transform:translateY(-1px)} .btn.black{background:#111;color:#fff}
.pattern{position:relative} .pattern::before{content:'✦';position:absolute;top:-8px;right:12px;background:var(--accent);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;}
</style>
</head>

  var c=document.createElement('canvas'); c.width=1080; c.height=1600; var ctx=c.getContext('2d');

  ctx.fillStyle='#111'; ctx.font='bold 54px sans-serif'; var t=tr.t; if(t.length>20) t=t.substring(0,20); ctx.fillText(t, 40, 80);
  ctx.font='26px sans-serif'; ctx.fillStyle='#777'; ctx.fillText((tr.totalTime||'')+' | '+(tr.cookTime||'')+' | '+tr.serv, 40, 120);
  var img=new Image(); img.crossOrigin='anonymous'; img.src=r.img;
  img.onload=function(){
    ctx.drawImage(img, 40, 150, 1000, 500);
    ctx.fillStyle='#111'; ctx.font='22px sans-serif'; var y=700;
    for(var i=0;i<Math.min(4,tr.ing.length);i++){ ctx.fillText(tr.ing[i].substring(0,45), 40, y); y+=30; }
    y+=20; ctx.font='bold 24px sans-serif'; ctx.fillText('步驟 Steps:', 40, y); y+=32; ctx.font='20px sans-serif';
    for(var i=0;i<Math.min(4,tr.step.length);i++){ ctx.fillText((i+1)+'. '+tr.step[i].substring(0,55), 40, y); y+=28; }
    if(tr.tips && tr.tips.length>0){ y+=20; ctx.font='bold 20px sans-serif'; ctx.fillText('Tips: '+tr.tips[0].substring(0,60), 40, y); }
    ctx.fillStyle='#FFC107'; ctx.fillRect(0,1510,1080,90);
    ctx.fillStyle='#111'; ctx.font='bold 28px sans-serif'; ctx.fillText("Joe's Recipe Lab - "+LANG, 40, 1565);
    var a=document.createElement('a'); a.download=r.rid+'_'+LANG+'.jpg'; a.href=c.toDataURL('image/jpeg',0.85); a.click();
  };
  img.onerror=function(){ alert('圖片載入失敗，請直接截圖'); };
}
if(urlParams.get('reset')=='1'){ localStorage.removeItem('recipe_lang'); location.href=location.pathname; }
init();
</script>
