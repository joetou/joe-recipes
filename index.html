<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joe's Recipe Lab - 阿Joe私房菜譜</title>
<style>
:root{--bg:#FFFCF5;--ink:#111;--muted:#777;--line:#EDE6D6;--accent:#FFC107}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:var(--ink)}
header{position:sticky;top:0;background:rgba(255,252,245,.95);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:10}
.logo{font-weight:800} .lang button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;margin-left:4px;cursor:pointer} .lang button.active{background:#111;color:#fff}
.main{max-width:1000px;margin:auto;padding:16px} .search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px}
.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0;padding-bottom:4px} .tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer} .tabs button.active{background:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px} .card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer} .card img{width:100%;height:180px;object-fit:cover} .card .p{padding:12px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;padding:16px;place-items:center} .modal.open{display:grid} .box{background:#fff;border-radius:18px;max-width:720px;width:100%;max-height:92vh;overflow:auto} .box img{width:100%;height:280px;object-fit:cover} .content{padding:16px} .btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer;margin-right:6px} .btn.black{background:#111;color:#fff}
.ing{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0} .ing div{background:#FFFDF0;border:1px solid #F5E9C6;border-radius:10px;padding:8px 10px;font-size:13px}
.step{display:flex;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;background:#fff} .num{width:32px;height:32px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-weight:800;flex-shrink:0}
.tip{background:#FFF8CC;border:1px solid var(--accent);border-radius:12px;padding:10px;margin:10px 0;font-size:13px}
.secret{background:#E8F5E9;border:1px solid #81C784;border-radius:12px;padding:10px;margin:10px 0;font-size:13px}
.admin{background:#FFFDF0;border:1px dashed var(--accent);border-radius:12px;padding:12px;margin-top:16px;display:none}
</style>
</head>
<body>
<header><div class="logo">Joe's Recipe Lab - 阿Joe私房菜譜</div><div><span id="lang"></span><button class="btn" onclick="openAdmin()">管理 / Maintain</button></div></header>
<div class="main">
<input id="q" class="search" placeholder="搜尋 / Search / Cari..." oninput="render()">
<div id="tabs" class="tabs"></div>
<div id="grid" class="grid"></div>
<div id="admin" class="admin">
<h3>管理後台 (密碼 8888)</h3>
<button class="btn black" onclick="resetAll()">🔄 一鍵重置 Reset (修復所有Bug)</button>
<button class="btn" onclick="exportJson()">匯出 Export</button>
<div id="adminList" style="margin-top:10px"></div>
</div>

let RECIPES = [];
try{
  const stored = JSON.parse(localStorage.getItem('joes_recipes')||'null');
  if(stored && stored.length>0 && stored[0].rid) RECIPES = stored;
  else RECIPES = SEED;
}catch(e){ RECIPES = SEED; }
function save(){ localStorage.setItem('joes_recipes', JSON.stringify(RECIPES)); }

function setLang(k){ LANG=k; localStorage.setItem('recipe_lang',k); init();
if(params.get('recipe')){ setTimeout(()=>openDetail(params.get('recipe')), 800); }
 }
function setCat(k){ CAT=k; initTabs(); render(); }
function init(){
  document.getElementById('lang').innerHTML=['zh','en','id'].map(x=>`<button class="${LANG==x?'active':''}" onclick="setLang('${x}')">${x.toUpperCase()}</button>`).join('');
  initTabs(); render();
}
function initTabs(){
  document.getElementById('tabs').innerHTML=CATS.map(c=>{ const label=c[LANG]||c.zh; const act=CAT==c.k?'active':''; return `<button class="${act}" onclick="setCat('${c.k}')">${label}</button>`; }).join('');
}
function getTr(r){ return r[LANG]||r.zh; }

function render(){
  const q=(document.getElementById('q').value||'').toLowerCase();
  let list = RECIPES.filter(r=>{ const c=r.cat||r.category; return CAT=='all'||c==CAT; }).filter(r=>{ const tr=getTr(r); return !q||tr.t.toLowerCase().includes(q); });
  const grid=document.getElementById('grid');
  if(list.length==0){ grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:40px;color:#888">暫無菜譜 / No recipes<br><br><button class="btn black" onclick="resetAll()">重置 Reset</button></div>`; return; }
  grid.innerHTML=list.map(r=>{ const tr=getTr(r); return `<div class="card" onclick="openDetail('${r.rid}')"><img src="${r.img}"><div class="p"><div style="font-weight:800">${tr.t}</div><div style="font-size:12px;color:#777;margin-top:4px">⏱️ ${tr.cookTime||tr.time} | 總 ${tr.totalTime||tr.time} | ${tr.serv} | ${tr.diff}</div></div></div>`; }).join('');
  document.getElementById('adminList').innerHTML=RECIPES.map(r=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee;font-size:12px"><span>${r.rid} - ${(r.zh&&r.zh.t)||''}</span><button onclick="delRecipe('${r.rid}')" style="color:red;background:none;border:none;cursor:pointer">刪</button></div>`).join('');
}

let currentRid='';
function openDetail(rid){
  currentRid=rid;
  const r=RECIPES.find(x=>x.rid==rid||x.id==rid); if(!r) return; const tr=getTr(r);
  document.getElementById('detailBox').innerHTML=`<img src="${r.img}"><div class="content"><h2 style="margin:0">${tr.t}</h2><div style="font-size:12px;color:#777;margin:6px 0">${tr.totalTime||tr.time} | ⏱️ ${tr.cookTime||''} | 🧑‍🍳 ${tr.prepTime||''} | ${tr.serv} | ${tr.diff}<br><small>⏲️ 總時間 Total: ${tr.totalTime||tr.time} | 煮 Cook: ${tr.cookTime||'-'} | 備 Prep: ${tr.prepTime||'-'}</small></div><h4>材料 / Ingredients</h4><div class="ing">${tr.ing.map(i=>`<div>${i}</div>`).join('')}</div><h4>步驟 Steps</h4>${tr.step.map((s,i)=>`<div class="step"><div class="num">${i+1}</div><div style="font-size:13px">${s}</div></div>`).join('')}${tr.tips?`<div class="tip"><b>💡 貼士 Tips</b><ul style="margin:6px 0 0 16px">${tr.tips.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}${tr.secret?`<div class="secret"><b>🤫 秘訣 Secrets</b><ul style="margin:6px 0 0 16px">${tr.secret.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}<div style="background:#F8F6F0;border-radius:10px;padding:10px;margin-top:10px;font-size:13px"><b>🍽️:</b> ${tr.serve}</div><div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
<button class="btn black" onclick="openShare(currentRid)">🔗 分享 Share</button>
<button class="btn" onclick="closeDetail()">關閉 Close</button>
</div></div>`;
  document.getElementById('detail').classList.add('open');
}
function closeDetail(){ document.getElementById('detail').classList.remove('open'); }
function openAdmin(){ const p=prompt('管理密碼:'); if(p!=='8888'){ if(p!==null)alert('密碼錯誤'); return; } document.getElementById('admin').style.display=document.getElementById('admin').style.display=='none'?'block':'none'; }
function delRecipe(rid){ if(confirm('刪除?')){ RECIPES=RECIPES.filter(x=>x.rid!=rid); save(); render(); } }
function resetAll(){ localStorage.removeItem('joes_recipes'); RECIPES=SEED; save(); location.href=location.pathname; }
function exportJson(){ const blob=new Blob([JSON.stringify(RECIPES,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='recipes.json'; a.click(); }

function openShare(rid){
  const r=RECIPES.find(x=>x.rid==rid); if(!r) return;
  const tr=getTr(r);
  const langLabel = {zh:'中文', en:'English', id:'Indonesia'}[LANG]||LANG;
  const url = location.origin+location.pathname+'?recipe='+r.rid+'&lang='+LANG;
  document.getElementById('shareBox').innerHTML=`<h3 style="margin:0">🔗 分享 Share</h3>
  <div style="margin:8px 0;font-size:13px;color:#555">正在分享：<b>${tr.t}</b> 的 <b>${langLabel} (${LANG})</b> 版本<br><small>只會分享呢一個菜譜嘅指定語言，唔會一次過分享晒三種語言</small></div>
  <div style="display:flex;gap:6px;margin:12px 0"><span style="font-size:12px;color:#888">切換語言 / Switch language:</span>${['zh','en','id'].map(k=>`<button class="btn ${LANG==k?'black':''}" onclick="LANG='${k}';localStorage.setItem('recipe_lang','${k}');initTabs();render();openShare('${r.rid}');">${k.toUpperCase()}</button>`).join('')}</div>
  <div style="background:#FFFDF0;border:1px solid #EDE6D6;border-radius:10px;padding:10px;font-size:13px;white-space:pre-wrap;max-height:240px;overflow:auto" id="shareText">${tr.t} - ${tr.totalTime||tr.time}
${tr.cookTime||''} ${tr.prepTime||''}

材料 (${langLabel}):
${tr.ing.join('
')}

步驟 (${langLabel}):
${tr.step.map((s,i)=> (i+1)+'. '+s).join('
')}

${url}</div>
  <div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">
    <button class="btn black" onclick="copyShare('${r.rid}')">📋 Copy 此語言版本</button>
    <button class="btn" onclick="copyLink('${r.rid}')">🔗 Copy 指定語言連結</button>
    <button class="btn" onclick="downloadCard('${r.rid}')">🖼️ 下載此語言 JPG</button>
    <button class="btn" onclick="closeShare()">關閉</button>
  </div>
  <div style="margin-top:10px;font-size:11px;color:#999">連結格式：?recipe=${r.rid}&lang=${LANG} → 對方一開就係呢個菜+呢種語言</div>`;
  document.getElementById('share').classList.add('open');
}
function closeShare(){ document.getElementById('share').classList.remove('open'); }
function copyShareSingle(rid){ return copyShare(rid); }
function copyShare(rid){
  const r=RECIPES.find(x=>x.rid==rid); const tr=getTr(r);
  const url=location.origin+location.pathname+'?recipe='+r.rid+'&lang='+LANG;
  const txt=`${tr.t} - ${tr.totalTime||tr.time}\n\n材料:\n${tr.ing.join('\n')}\n\n步驟:\n${tr.step.map((s,i)=> (i+1)+'. '+s).join('\n')}\n\n${url}`;
  navigator.clipboard.writeText(txt).then(()=>alert('已複製文字 / Copied!'));
}
function copyLink(rid){
  const url=location.origin+location.pathname+'?recipe='+rid+'&lang='+LANG;
  navigator.clipboard.writeText(url).then(()=>alert('連結已複製: '+url));
}
function downloadCard(rid){
  const r=RECIPES.find(x=>x.rid==rid); const tr=getTr(r);
  const c=document.createElement('canvas'); c.width=1080; c.height=1350; const ctx=c.getContext('2d');
  ctx.fillStyle='#FFFCF5'; ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle='#111'; ctx.font='bold 54px sans-serif'; ctx.fillText(tr.t, 40, 80);
  ctx.font='28px sans-serif'; ctx.fillStyle='#777'; ctx.fillText((tr.totalTime||tr.time)+' | '+tr.serv+' | '+(tr.cookTime||''), 40, 120);
  const img=new Image(); img.crossOrigin='anonymous'; img.src=r.img;
  img.onload=()=>{
    ctx.drawImage(img, 40, 150, 1000, 600);
    ctx.fillStyle='#111'; ctx.font='26px sans-serif';
    let y=800; tr.ing.slice(0,5).forEach(ing=>{ ctx.fillText(ing, 40, y); y+=32; });
    y+=20; ctx.font='bold 26px sans-serif'; ctx.fillText('步驟:', 40, y); y+=32; ctx.font='24px sans-serif';
    tr.step.slice(0,4).forEach((s,i)=>{ ctx.fillText((i+1)+'. '+s.substring(0,50), 40, y); y+=30; });
    ctx.fillStyle='#FFC107'; ctx.fillRect(0,1260,1080,90);
    ctx.fillStyle='#111'; ctx.font='bold 28px sans-serif'; ctx.fillText("Joe's Recipe Lab - "+location.host, 40, 1315);
    const a=document.createElement('a'); a.download=r.rid+'.jpg'; a.href=c.toDataURL('image/jpeg',0.85); a.click();
  };
  img.onerror=()=>{ alert('圖片載入失敗，試下直接截圖'); };
}
const params=new URLSearchParams(location.search); 
 if(params.get('reset')=='1'){ localStorage.removeItem('joes_recipes'); location.href=location.pathname; }
init();
if(params.get('recipe')){ setTimeout(()=>openDetail(params.get('recipe')), 800); }

</script>
</body>
